<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daybook — Team Daily Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#F7F5F0;
    --paper-raised:#FFFFFF;
    --ink:#1C2321;
    --ink-soft:#5B625E;
    --navy:#2C4A52;
    --navy-dim:#3E6570;
    --line:#DEDAD1;
    --line-soft:#EAE7E0;
    --office:#3D7A5C;
    --office-bg:#E7F1EB;
    --wfh:#3E6FA8;
    --wfh-bg:#E8EFF8;
    --leave:#B8763E;
    --leave-bg:#F5EBDF;
    --hol:#7452A0;
    --hol-bg:#F0EAF7;
    --danger:#B54545;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,35,33,0.06), 0 8px 24px rgba(28,35,33,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#CFE3D6;}
  .app{min-height:100vh;}
  .auth-page{padding:28px 20px 60px;}

  /* ---------- App shell: sidebar + main ---------- */
  :root{
    --side:#1D393F;
    --side-ink:#E7EFED;
    --side-dim:#9CB4B4;
    --side-line:rgba(255,255,255,.10);
    --accent:#7FD1A2;
    --amber:#E4A15A;
  }
  .shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;}
  .sidebar{
    background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
    padding:22px 14px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
  }
  .sb-brand{display:flex;align-items:center;gap:11px;padding:2px 10px 20px;}
  .sb-brand .name{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.1;}
  .sb-brand .sub{font-size:11.5px;color:var(--side-dim);margin-top:2px;}

  .mode-box{background:rgba(255,255,255,.06);border:1px solid var(--side-line);border-radius:13px;padding:11px 11px 12px;margin-bottom:20px;}
  .mode-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-dim);font-weight:700;margin:0 3px 9px;}
  .mode-seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:rgba(0,0,0,.24);border-radius:10px;padding:3px;}
  .mode-seg button{
    border:none;background:transparent;color:var(--side-dim);font:600 12.5px 'Inter',sans-serif;
    padding:8px 6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s ease;
  }
  .mode-seg button:hover{color:#fff;}
  .mode-seg button.active{background:#F7F5F0;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .mode-hint{font-size:11.5px;line-height:1.5;color:var(--side-dim);margin:10px 3px 0;}

  .nav-group{margin-bottom:16px;}
  .nav-title{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-dim);font-weight:700;padding:0 10px;margin-bottom:6px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;color:var(--side-ink);
    font:500 13.5px 'Inter',sans-serif;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;position:relative;transition:background .12s ease;
  }
  .nav-item svg{opacity:.72;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.07);}
  .nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-item.active::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
  .nav-badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--amber);color:#2B1C08;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;}
  .nav-badge.soft{background:rgba(255,255,255,.16);color:#fff;}

  .sb-user{margin-top:auto;border-top:1px solid var(--side-line);padding-top:14px;display:flex;align-items:center;gap:10px;}
  .sb-av{width:36px;height:36px;border-radius:50%;background:#E7EFED;color:var(--navy);display:flex;align-items:center;justify-content:center;font:700 13px 'Space Grotesk',sans-serif;flex-shrink:0;}
  .sb-user .who{min-width:0;}
  .sb-user .nm{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-user .rl{font-size:11.5px;color:var(--side-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sb-signout{margin-left:auto;background:transparent;border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:7px;cursor:pointer;display:flex;flex-shrink:0;}
  .sb-signout:hover{background:rgba(255,255,255,.08);}

  .main{min-width:0;padding:0 36px 90px;}
  .main-inner{max-width:960px;}
  .m-bar{display:none;}
  .scrim{display:none;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:32px 0 22px;flex-wrap:wrap;}
  .page-title{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;margin:0;letter-spacing:-.018em;}
  .page-sub{margin:5px 0 0;color:var(--ink-soft);font-size:13.5px;}
  .head-meta{display:flex;align-items:center;gap:10px;}
  .head-date{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);}
  .mode-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:5px 11px;border-radius:999px;}
  .mode-pill.manager{background:var(--wfh-bg);color:var(--wfh);}
  .mode-pill.employee{background:var(--office-bg);color:var(--office);}
  .demo-strip{display:flex;align-items:center;gap:8px;margin-top:18px;background:var(--wfh-bg);border:1px solid #C5D7EC;color:#2F557F;border-radius:9px;padding:8px 14px;font-size:12.5px;}


  /* ---------- Day drawer: slides in from the right ---------- */
  body.drawer-open{overflow:hidden;}
  .drawer-layer{position:fixed;inset:0;z-index:70;}
  .drawer-scrim{position:absolute;inset:0;background:rgba(15,25,28,.42);}
  .drawer{
    position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper-raised);
    box-shadow:-14px 0 44px rgba(15,25,28,.24);display:flex;flex-direction:column;
  }
  .drawer-layer.enter .drawer-scrim{animation:dbFadeIn .22s ease both;}
  .drawer-layer.enter .drawer{animation:dbSlideIn .28s cubic-bezier(.2,.8,.2,1) both;}
  .drawer-layer.leaving .drawer-scrim{animation:dbFadeOut .2s ease both;}
  .drawer-layer.leaving .drawer{animation:dbSlideOut .2s ease both;}
  @keyframes dbFadeIn{from{opacity:0}to{opacity:1}}
  @keyframes dbFadeOut{from{opacity:1}to{opacity:0}}
  @keyframes dbSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  @keyframes dbSlideOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){
    .drawer-layer.enter .drawer,.drawer-layer.enter .drawer-scrim,.drawer-layer.leaving .drawer,.drawer-layer.leaving .drawer-scrim{animation-duration:.01s;}
  }
  .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line);}
  .drawer-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
  .drawer-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em;line-height:1.2;}
  .drawer-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;}
  .drawer-close:hover{border-color:var(--ink-soft);}
  .drawer-body{padding:20px 22px 24px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
  .drawer-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
  .drawer-hours{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1;}
  .drawer-hours small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:4px;font-family:'Inter',sans-serif;}
  .drawer-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:0 0 8px;}
  .dr-entry{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--line-soft);}
  .dr-entry:first-of-type{border-top:1px solid var(--line-soft);}
  .dr-time{font-family:'JetBrains Mono',monospace,monospace;font-size:12.5px;color:var(--navy);background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:3px 8px;align-self:start;white-space:nowrap;}
  .dr-desc{font-size:14px;line-height:1.5;}
  .dr-dur{grid-column:2;font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace,monospace;}
  .dr-quote{background:var(--paper);border:1px solid var(--line-soft);border-left:3px solid var(--leave);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.6;}
  .dr-meta{margin-top:20px;font-size:12.5px;color:var(--ink-soft);}
  .dr-empty{text-align:center;padding:36px 10px;color:var(--ink-soft);}
  .dr-empty .big{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--ink);margin:10px 0 4px;}
  .drawer-foot{padding:14px 22px;padding-bottom:max(14px, env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--paper-raised);}
  .ts-day:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  @media(max-width:640px){
    .drawer-head,.drawer-body,.drawer-foot{padding-left:18px;padding-right:18px;}
    .drawer-foot .btn{flex:1;}
  }

  /* ---------- Assign a task: guided form ---------- */
  .form-card{padding:24px 26px 22px;}
  .card .form-title{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;text-transform:none;color:var(--ink);}
  .form-sub{font-size:13px;color:var(--ink-soft);margin:0 0 24px;}
  .step{margin-bottom:22px;}
  .step-label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:10px;}
  .step-n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font:700 11.5px 'Space Grotesk',sans-serif;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-label .opt{font-weight:500;font-size:12px;color:var(--ink-soft);}
  .step-label .step-aside{margin-left:auto;}
  .control{width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s,background .15s;}
  .control:focus{border-color:var(--navy);background:#fff;}
  .control.lg{font-size:17px;padding:13px 14px;font-weight:500;}
  textarea.control{min-height:92px;resize:vertical;line-height:1.5;}
  .step .date-control{max-width:240px;}
  .assignee-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;}
  .assignee-grid .assignee-check{margin-bottom:0;padding:11px 12px;border-radius:9px;}
  .form-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .assign-summary{font-size:13px;color:var(--ink-soft);}
  .assign-summary strong{color:var(--ink);}
  .btn-lg{padding:12px 30px;font-size:14.5px;}
  .tracker-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .tracker-head h2{margin:0;}
  .tracker-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;}
  .tracker-sum span{background:var(--paper);border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px;color:var(--ink-soft);}
  .tracker-sum b{color:var(--ink);font-weight:700;}
  .tracker-sum .warn b{color:var(--danger);}
  .chip .cnt{opacity:.6;font-weight:600;margin-left:5px;}
  @media(max-width:640px){
    .form-card{padding:20px 16px 18px;}
    .control{font-size:16px;}
    .step .date-control{max-width:none;}
    .assignee-grid{grid-template-columns:1fr;}
    .assignee-grid .assignee-check{padding:13px 12px;}
    .form-actions{flex-direction:column-reverse;align-items:stretch;}
    .btn-lg{width:100%;}
    .assign-summary{text-align:center;}
  }

  @media(max-width:640px){
    .ts-grid{gap:4px;}
    .ts-dow{font-size:10px;letter-spacing:0;}
    .ts-day{aspect-ratio:1/1;padding:2px;gap:2px;border-radius:7px;}
    .ts-day .dnum{font-size:12px;}
    .ts-day .dchip{width:12px;}
    .ts-hrs{font-size:8.5px;}
    .legend{gap:10px 12px;}
    .ts-toolbar{gap:10px;}
    .ts-month-label{min-width:0;flex:1;}
    .ts-month-nav{width:100%;justify-content:space-between;}
  }

  /* ---------- Home ---------- */
  .home-row{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px;}
  .home-row > .card{margin-bottom:0;}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:12px;}
  .today-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;margin-bottom:6px;}
  .today-sub{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;}
  .today-line{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .mono{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}
  .quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .quick-btn{border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:11px 8px;font:600 13px 'Inter',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all .14s ease;color:var(--ink);}
  .quick-btn:hover{transform:translateY(-1px);}
  .quick-btn.office:hover{border-color:var(--office);background:var(--office-bg);}
  .quick-btn.wfh:hover{border-color:var(--wfh);background:var(--wfh-bg);}
  .quick-btn.leave:hover{border-color:var(--leave);background:var(--leave-bg);}
  .quick-btn .qi{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .quick-btn.office .qi{background:var(--office-bg);color:var(--office);}
  .quick-btn.wfh .qi{background:var(--wfh-bg);color:var(--wfh);}
  .quick-btn.leave .qi{background:var(--leave-bg);color:var(--leave);}
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;}
  .tile .num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;line-height:1.1;}
  .tile .lbl{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .tile.office .num{color:var(--office);} .tile.wfh .num{color:var(--wfh);} .tile.leave .num{color:var(--leave);} .tile.warn .num{color:var(--danger);}
  .section-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px;}
  .section-title .rule{flex:1;height:1px;background:var(--line);}
  .mini-task{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .mini-task:last-of-type{border-bottom:none;}
  .mini-task .t{font-weight:600;min-width:0;}
  .mini-task .d{font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  .mini-task .d.overdue{color:var(--danger);font-weight:600;}
  .link-row{margin-top:10px;display:flex;justify-content:flex-end;}
  .await-list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
  .await-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #E9D3B4;background:var(--leave-bg);border-radius:999px;padding:4px 11px 4px 5px;font-size:12.5px;font-weight:600;}
  .await-chip .avatar{width:22px;height:22px;font-size:9.5px;background:var(--leave);}
  .all-clear{font-size:13px;color:var(--office);font-weight:600;margin-top:14px;}

  @media(max-width:900px){
    .shell{grid-template-columns:1fr;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:284px;transform:translateX(-102%);transition:transform .22s ease;}
    .shell.nav-open .sidebar{transform:translateX(0);box-shadow:8px 0 30px rgba(0,0,0,.28);}
    .shell.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,25,28,.45);z-index:35;}
    .nav-item.active::before{left:-14px;}
    .m-bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -18px;padding:11px 18px;}
    .m-bar .burger{border:1px solid var(--line);background:var(--paper-raised);border-radius:9px;padding:7px;display:flex;cursor:pointer;color:var(--ink);}
    .m-bar .mb-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
    .m-bar .mode-pill{margin-left:auto;}
    .main{padding:0 18px 80px;}
    .page-head{padding:22px 0 16px;}
    .page-title{font-size:23px;}
    .head-meta .mode-pill{display:none;}
    .home-row{grid-template-columns:1fr;}
  }

  /* Card base */
  .card{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .section{padding:20px 22px;margin-bottom:16px;}
  .section h2{font-family:'Space Grotesk',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 14px;}

  /* Profile row */
  .profile-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field input, .field select, .field textarea{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
    background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy);background:#fff;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:7px;border:1px solid transparent;
    cursor:pointer;transition:all .15s ease;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dim);}
  .btn-primary:disabled{background:#B7C2C4;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-text{background:transparent;border:none;color:var(--navy);font-weight:600;font-size:13px;cursor:pointer;padding:4px 6px;}
  .btn-text:hover{text-decoration:underline;}
  .btn-danger-text{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;padding:2px 6px;line-height:1;}

  /* Date control */
  .date-row{display:flex;align-items:center;gap:10px;}
  .date-row input[type=date]{font-family:'JetBrains Mono',monospace;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);}

  /* Status selector */
  .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .status-card{
    border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 14px;cursor:pointer;text-align:left;
    background:var(--paper);transition:all .15s ease;position:relative;
  }
  .status-card:hover{border-color:var(--ink-soft);}
  .status-card .icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .status-card .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;}
  .status-card .desc{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .status-card.office .icon{background:var(--office-bg);color:var(--office);}
  .status-card.wfh .icon{background:var(--wfh-bg);color:var(--wfh);}

/* Shows the error on screen instead of a blank page, so it can be reported. */
(function(){
  function show(msg, where){
    var a = document.getElementById('app');
    if(!a || a.innerHTML.trim()) return;
    var d = document.createElement('div');
    d.style.cssText = 'padding:24px;font:14px Inter,sans-serif;max-width:640px';
    d.innerHTML = '<h3 style="margin:0 0 8px">Daybook hit an error</h3><pre style="white-space:pre-wrap;background:#fff;border:1px solid #ddd;padding:12px;border-radius:8px"></pre><p>Please send a screenshot of this to your admin.</p>';
    d.querySelector('pre').textContent = msg + (where ? '\n' + where : '');
    a.appendChild(d);
  }
  window.addEventListener('error', function(e){ show(e.message || 'Unknown error', 'line ' + e.lineno); });
  window.addEventListener('unhandledrejection', function(e){ show((e.reason && e.reason.message) || String(e.reason), ''); });
})();
</script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzaHhob2h5YXVuaWlseXFpcWRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzM0NDYsImV4cCI6MjA5OTE0OTQ0Nn0.lICjIQ4NzKl9GEmzWPWpB2Bb4qYeiXjDrRjqN6S8n6E';  // the long "anon public" key

function rowToReport(row){
  return {
    status: row.status,
    entries: row.entries || [],
    leaveType: row.leave_type,
    leaveReason: row.leave_reason,
    managerName: row.manager_name || '',

/* ---------- Auth state machine ----------
   screen: loading | login | sent | setup-profile | app
   Every login/logout/profile-save event re-decides the screen and repaints.
   Managers are stored BY NAME in the `manager_emails` table (email + manager_name);
   a person's `profiles.manager_name` says who they report to. */
const auth = {
  session: null,
  profile: null,     // row from the `profiles` table
  screen: 'loading',
  lastEmail: '',
  canBeManager: false, // is this email on the manager_emails allowlist?
  managerDirectoryName: '', // this person's own name as listed in manager_emails
  managers: [],       // [{id: email, full_name: manager_name}] — from manager_emails
};

async function initAuth(){
  if(!sb){ auth.screen = 'login'; paint(); return; }
  const { data:{ session } } = await sb.auth.getSession();
  await handleSession(session);
  sb.auth.onAuthStateChange((_event, session)=>{ handleSession(session); });
}

async function checkManagerEligibility(){
  auth.canBeManager = false;
  auth.managerDirectoryName = '';
  if(!sb || !auth.session) return;
  try{
    const email = String(auth.session.user.email || '').trim();
    const { data, error } = await sb.from('manager_emails').select('email, manager_name').ilike('email', email.replace(/[%_]/g, m=>'\\'+m)).maybeSingle();
    if(error) throw error;
    auth.canBeManager = !!data;
    auth.managerDirectoryName = data && data.manager_name ? String(data.manager_name).trim() : '';
  }catch(e){ console.error(e); auth.canBeManager = false; }
}

async function loadManagersList(){
  if(!sb) { auth.managers = []; return; }
  try{
    const { data, error } = await sb.from('manager_emails').select('email, manager_name').order('manager_name');
    if(error) throw error;
    const me = auth.session ? String(auth.session.user.email||'').toLowerCase() : '';
    auth.managers = (data || [])
      .filter(m => m.email && m.manager_name && String(m.email).toLowerCase() !== me)
      .map(m => ({ id: String(m.email).trim(), full_name: String(m.manager_name).trim() }));
  }catch(e){ console.error(e); showToast('Could not load manager list — ' + (e.message||'check Supabase')); auth.managers = []; }
}

function managerNameById(id){
  const m = auth.managers.find(x=>x.id===id);
  return m ? m.full_name : '';
}
function managerIdByName(name){
  const m = auth.managers.find(x=>x.full_name===name);
  return m ? m.id : '';
}

async function handleSession(session){
  auth.session = session;
  if(!session){

    auth.screen = 'login';

    state.role = 'home';

  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

      managerName: mName
    };
    if(!state._modeInit){ state.mode = auth.profile.role === 'manager' ? 'manager' : 'employee'; state._modeInit = true; }

function currentMonthKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- Holiday helpers ---------- */
// Working week used for "days left to fill". 0=Sun … 6=Sat. Add 6 if your team works Saturdays.
const WORK_DAYS = [1,2,3,4,5];
async function refreshHolidays(){ state.holidays = await loadHolidays(); state.holidaysLoaded = true; }
function holidayOn(iso){ return state.holidays[iso] || null; }
function isWorkDay(iso){
  return WORK_DAYS.includes(new Date(iso+'T00:00:00').getDay()) && !state.holidays[iso];
}
function monthHolidayCount(yearMonth){
  return Object.keys(state.holidays).filter(d=>d.startsWith(yearMonth)).length;
}
// working days before today with no report from this person
function pendingDays(yearMonth, employeeName, monthData){
  const today = todayISO(), out = [];
  for(let day=1; day<=daysInMonth(yearMonth); day++){
    const iso = isoOf(yearMonth, day);
    if(iso >= today) break;
    if(isWorkDay(iso) && !(monthData[iso]||{})[employeeName]) out.push(iso);
  }
  return out;
}
function holidayBanner(iso, forManager){
  const name = holidayOn(iso);
  if(!name) return '';
  return `
  <div class="banner hol-banner">
    <div>
      <div class="msg">Public holiday — ${esc(name)}</div>
      <div class="sub">${forManager ? 'No reports are expected on this day.' : 'No report needed for ' + fmtDate(iso) + '. If you worked anyway, you can still submit one below.'}</div>
    </div>
  </div>`;
}

function timeToHours(t){
  if(!t || !t.includes(':')) return null;
  const [h,m] = t.split(':').map(Number);
  return h + (m||0)/60;
}
function entryHours(e){
  const s = timeToHours(e.start), en = timeToHours(e.end);
  if(s===null || en===null || en<=s) return 0;
  return en - s;
}
function reportHours(report){
  if(!report || report.status==='leave') return 0;
  return (report.entries||[]).reduce((sum,e)=>sum+entryHours(e), 0);
}
function fmtHours(h){
  return (Math.round(h*10)/10).toString();
}

function monthLabel(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-US',{month:'long', year:'numeric'});
}
function shiftMonth(yearMonth, delta){
  const [y,m] = yearMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function daysInMonth(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function isoOf(yearMonth, day){
  return yearMonth+'-'+String(day).padStart(2,'0');
}

// Builds the calendar grid HTML for a given month, coloring days by the
// given employee's report status. `monthData` = {date: {name: report}}
function calendarGrid(yearMonth, employeeName, monthData, selectedDate){
  const [y,m] = yearMonth.split('-').map(Number);
  const firstDow = new Date(y, m-1, 1).getDay(); // 0=Sun
  const total = daysInMonth(yearMonth);
  const today = todayISO();
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let cells = dows.map(d=>`<div class="ts-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) cells += `<div class="ts-day blank"></div>`;

  for(let day=1; day<=total; day++){
    const iso = isoOf(yearMonth, day);
    const rep = (monthData[iso] || {})[employeeName];
    const future = iso > today;
    const status = rep ? rep.status : 'none';
    const hol = state.holidays[iso] || null;
    const clickable = !future || !!hol;
    const classes = ['ts-day', status!=='none'?status:'', (hol && !rep)?'holiday':'', future?'future':'', iso===today?'today':'', iso===selectedDate?'selected':''].filter(Boolean).join(' ');
    const hrs = rep && rep.status!=='leave' ? reportHours(rep) : 0;
    const label = fmtDate(iso) + (hol ? ', holiday: '+hol : '') + (rep ? ', '+statusLabel(rep.status) : (hol ? '' : ', no report'));
    cells += `
      <div class="${classes}" data-iso="${clickable?iso:''}" ${hol?`title="${esc(hol)}"`:''} ${clickable?`tabindex="0" role="button" aria-label="${esc(label)}"`:''}>
        <div class="dnum">${day}</div>
        ${status!=='none' ? `<div class="dchip"></div>` : (hol ? `<div class="dchip hol"></div>` : '')}
        ${hrs>0 ? `<div class="ts-hrs">${fmtHours(hrs)}h</div>` : ''}
        ${hol && !rep ? `<div class="hol-tag">${esc(hol)}</div>` : ''}
        ${hol && rep ? `<span class="hol-mark"></span>` : ''}
      </div>`;
  }
  return `<div class="ts-grid">${cells}</div>`;
}

function monthSummary(employeeName, monthData){
  let office=0, wfh=0, leave=0, hours=0;
  Object.values(monthData).forEach(dayObj=>{
    const rep = dayObj[employeeName];
    if(!rep) return;
    if(rep.status==='office') office++;
    else if(rep.status==='wfh') wfh++;
    else if(rep.status==='leave') leave++;
    hours += reportHours(rep);
  });
  return {office, wfh, leave, hours, total: office+wfh+leave};
}

function dayDrawerHTML(iso, report, opts){
  opts = opts || {};
  const own = !!opts.own;
  const d = new Date(iso+'T00:00:00');
  const longDate = d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const enter = state._drawerEnter; state._drawerEnter = false;
  const canFill = own && iso <= todayISO();

  const hol = holidayOn(iso);
  let body = '';
  if(!report && hol){
    body = `
      <div class="dr-empty">

        <div class="big">${esc(hol)}</div>
        <div>Public holiday — no report is needed${own ? '. If you worked anyway you can still add one.' : '.'}</div>
      </div>`;
  } else if(!report){
    body = `

        ${ico('calendar',34)}

      </div>`;

      <div class="drawer-label">Reason</div>

  } else {

      <div class="drawer-summary">
        <span class="badge ${report.status}">${statusLabel(report.status)}</span>
        <div class="drawer-hours">${fmtHours(reportHours(report))}<small>hours logged</small></div>
      </div>
      <div class="drawer-label">Work log · ${entries.length} ${entries.length===1?'entry':'entries'}</div>
      ${entries.map(e=>`
        <div class="dr-entry">
          <span class="dr-time">${esc(e.start)}–${esc(e.end)}</span>
          <span class="dr-desc">${esc(e.description)}</span>
          <span class="dr-dur">${fmtHours(entryHours(e))}h</span>

  }
  if(report && hol){
    body = `<div class="dr-holiday">${ico('sun',16)}<span>Public holiday — ${esc(hol)}</span></div>` + body;
  }
  if(report && report.submittedAt){
    const t = new Date(report.submittedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    body += `<div class="dr-meta">Submitted${report.managerName ? ' to ' + esc(report.managerName) : ''} at ${t}</div>`;
  }

      </header>

      </footer>

}

function closeDrawer(){
  const layer = document.getElementById('drawer-layer');
  if(!layer){ state.tsSelected = null; return; }
  if(layer.classList.contains('leaving')) return;
  layer.classList.remove('enter');
  layer.classList.add('leaving');
  setTimeout(()=>{ state.tsSelected = null; render(); }, 190);
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && document.getElementById('drawer-layer')) closeDrawer();
});

function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(cell=>{
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportEmployeeMonthCSV(employeeName, yearMonth, monthData){
  const total = daysInMonth(yearMonth);
  const rows = [['Date','Day','Status','Hours','Details']];
  for(let day=1; day<=total; day++){
    const iso = isoOf(yearMonth, day);
    const rep = (monthData[iso] || {})[employeeName];
    const dow = new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'});
    if(!rep){ const h = state.holidays[iso]; rows.push([iso, dow, h?'Holiday':'', '', h||'']); continue; }
    if(rep.status==='leave'){
      rows.push([iso, dow, statusLabel(rep.status), '', (rep.leaveType||'')+' — '+(rep.leaveReason||'')]);
    } else {
      const details = (rep.entries||[]).map(e=>`${e.start}-${e.end} ${e.description}`).join(' | ');
      rows.push([iso, dow, statusLabel(rep.status), fmtHours(reportHours(rep)), details]);
    }
  }
  const s = monthSummary(employeeName, monthData);
  rows.push([]);
  rows.push(['Summary','','','','']);
  rows.push(['In-Office days', s.office]);
  rows.push(['WFH days', s.wfh]);
  rows.push(['Leave days', s.leave]);
  rows.push(['Public holidays', monthHolidayCount(yearMonth)]);
  rows.push(['Total hours logged', fmtHours(s.hours)]);
  downloadCSV(`${employeeName.replace(/\s+/g,'_')}_timesheet_${yearMonth}.csv`, rows);
}

function exportTeamMonthCSV(yearMonth, monthData, members){
  const rows = [['Employee','In-Office days','WFH days','Leave days','Total hours']];
  members.forEach(name=>{
    const s = monthSummary(name, monthData);
    if(s.total>0) rows.push([name, s.office, s.wfh, s.leave, fmtHours(s.hours)]);
  });
  downloadCSV(`team_timesheet_${yearMonth}.csv`, rows);
}

  { key:'mgrts',  label:'Employee Timesheets',  icon:'table' },

function ico(name, size){
  size = size || 18;
  const p = {
    home:     '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
    edit:     '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    check:    '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    users:    '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    table:    '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
    assign:   '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6M9 14h6"/>',
    logout:   '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
    menu:     '<path d="M3 6h18M3 12h18M3 18h18"/>',
    close:    '<path d="M6 6l12 12M18 6L6 18"/>',
    user:     '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    office:   '<rect x="2" y="6" width="12" height="8" rx="1"/><path d="M5 6V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>',
    wfh:      '<path d="M2 8L8 2l6 6"/><path d="M3.5 7v6a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V7"/>',
    leave:    '<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5H14M5 1.5V4M11 1.5V4"/>',
  }[name] || '';
  const vb = (name==='office'||name==='wfh'||name==='leave') ? '0 0 16 16' : '0 0 24 24';
  return `<svg width="${size}" height="${size}" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="${vb==='0 0 16 16'?1.4:1.7}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

function isManagerUser(){ return !!(auth.profile && auth.profile.role === 'manager'); }
function inManagerMode(){ return isManagerUser() && state.mode === 'manager'; }

function greeting(){
  const h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
function firstName(){ return (state.profile.name||'').trim().split(/\s+/)[0] || 'there'; }

function pageMeta(key){
  const mgr = state.profile.managerName;
  const meta = {
    home:      { title:'Home', sub: greeting() + ', ' + firstName() + '. Here’s where things stand today.' },
    employee:  { title:'Daily Entry', sub: mgr ? 'Log your status and work — it goes to ' + mgr + '.' : 'Log your status and the work you did.' },
    timesheet: { title:'My Timesheet', sub:'Your month at a glance. Select any day to open its details.' },
    holidays:  { title:'Holidays', sub:'Company holidays are pre-filled on every calendar — you only fill in the remaining days.' },
    tasks:     { title:'My Tasks', sub:'Everything assigned to you, with due dates and status.' },
    roster:    { title:"Today's Roster", sub:'Who is in, remote or away — and who hasn’t reported yet.' },
    mgrts:     { title:'Employee Timesheets', sub:'Pick a person and a month. Export one person or the whole team.' },
    assign:    { title:'Assign & Track', sub:'Hand out tasks to your team and follow their progress.' },
  };
  return meta[key] || meta.home;
}

function navItem(n){
  const active = state.role === n.key ? 'active' : '';
  let badge = '';
  if(n.key==='tasks' && state.counts.tasks > 0) badge = `<span class="nav-badge soft">${state.counts.tasks}</span>`;
  if(n.key==='roster' && state.counts.awaiting > 0) badge = `<span class="nav-badge" title="Haven't reported yet">${state.counts.awaiting}</span>`;
  return `<button class="nav-item ${active}" data-nav="${n.key}">${ico(n.icon)}<span>${n.label}</span>${badge}</button>`;
}

function sidebarHTML(){
  const mgrUser = isManagerUser();
  const mgrMode = inManagerMode();
  const roleLabel = mgrUser ? 'Manager' : 'Employee';
  const sub = state.profile.managerName ? 'Reports to ' + state.profile.managerName : roleLabel;
  return `
  <aside class="sidebar">
    <div class="sb-brand">
      <svg width="30" height="30" viewBox="0 0 26 26" fill="none">

        <path d="M2 9H24" stroke="#E7EFED" stroke-width="1.6"/>
        <circle cx="8" cy="6" r="0.9" fill="#E7EFED"/><circle cx="18" cy="6" r="0.9" fill="#E7EFED"/>
        <path d="M6.5 14H11.5M6.5 18H15" stroke="#7FD1A2" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div><div class="name">Daybook</div><div class="sub">Daily reports &amp; timesheets</div></div>
    </div>

    ${mgrUser ? `
    <div class="mode-box">

      <div class="mode-seg" role="group" aria-label="Switch view">
        <button data-mode="employee" class="${!mgrMode?'active':''}">${ico('user',15)}Employee</button>
        <button data-mode="manager" class="${mgrMode?'active':''}">${ico('briefcase',15)}Manager</button>
      </div>
      <div class="mode-hint">${mgrMode
        ? 'Your own work <strong style="color:#fff;font-weight:600;">plus</strong> your team’s reports, timesheets and tasks.'

    </div>` : ''}

    <nav>
      <div class="nav-group">
        ${mgrMode ? `<div class="nav-title">My work</div>` : ''}

      </div>
      ${mgrMode ? `
      <div class="nav-group">
        <div class="nav-title">My team</div>
        ${NAV_TEAM.map(navItem).join('')}

    <div class="sb-user">
      <div class="sb-av">${esc(initials(state.profile.name))}</div>
      <div class="who"><div class="nm">${esc(state.profile.name)}</div><div class="rl">${esc(sub)}</div></div>
      <button class="sb-signout" id="sign-out" title="Sign out" aria-label="Sign out">${ico('logout',16)}</button>

function shell(body){
  const meta = pageMeta(state.role);
  const mgrUser = isManagerUser();
  const mgrMode = inManagerMode();
  const pill = mgrUser
    ? `<span class="mode-pill ${mgrMode?'manager':'employee'}">${ico(mgrMode?'briefcase':'user',13)}${mgrMode?'Manager view':'Employee view'}</span>`
    : '';
  const d = new Date().toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'});
  return `
  <div class="shell" id="shell">
    <div class="scrim" id="scrim"></div>
    ${sidebarHTML()}
    <div class="main">
      <div class="m-bar">
        <button class="burger" id="burger" aria-label="Open menu">${ico('menu',20)}</button>
        <span class="mb-name">Daybook</span>
        ${pill}
      </div>
      <div class="main-inner">
        ${setupBanner()}
        <div class="page-head">
          <div>
            <h1 class="page-title">${meta.title}</h1>
            <p class="page-sub">${meta.sub}</p>
          </div>
          <div class="head-meta">${pill}<span class="head-date">${d}</span></div>
        </div>
        ${body}
      </div>
    </div>
  </div>`;
}

function setupBanner(){
  if(typeof DEMO_MODE !== 'undefined' && DEMO_MODE){
    return `<div class="demo-strip"><strong>Demo</strong> — sample data only, nothing is saved. Refresh the page to reset.</div>`;
  }
  if(SB_READY) return '';
  return `
  <div class="card section" style="background:#FCEFE3;border-color:#EAC190;padding:14px 20px;margin:18px 0 0;">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:3px;">Database not connected yet</div>
    <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;">
      Reports won't save until this is set up. Open this file, find <code>SUPABASE_URL</code> and
      <code>SUPABASE_ANON_KEY</code> near the top of the code, and paste in your project's values —
      see FULL_LIVE_GUIDE.md for the exact steps.
    </div>
  </div>`;
}

/* ---------- Render root ---------- */
async function render(){
  const app = document.getElementById('app');
  if(!isManagerUser()) state.mode = 'employee';
  const teamAllowed = inManagerMode();
  let k = state.role;
  if(TEAM_PAGES.includes(k) && !teamAllowed) k = state.role = 'home';

  if(!state.holidaysLoaded) await refreshHolidays();
  let body;
  if(k==='employee') body = await employeeView();
  else if(k==='timesheet') body = await timesheetView();
  else if(k==='tasks') body = await myTasksView();
  else if(k==='holidays') body = await holidaysView();
  else if(k==='roster') body = await managerRosterView();
  else if(k==='mgrts') body = await managerTimesheetView();
  else if(k==='assign') body = await assignTasksView();
  else { state.role = 'home'; body = await homeView(); }

  app.innerHTML = shell(body);
  bindEvents();
  const layer = document.getElementById('drawer-layer');
  document.body.classList.toggle('drawer-open', !!layer);
  if(layer && layer.classList.contains('enter')){
    const c = document.getElementById('drawer-close');
    if(c) c.focus({ preventScroll:true });
  }
}

/* ---------- Home ---------- */
function taskDueLabel(t){
  if(!t.dueDate) return 'No due date';
  return (isOverdue(t.dueDate, t.status) ? 'Overdue · ' : 'Due ') + fmtDate(t.dueDate);
}

async function homeView(){
  const today = todayISO();
  const teamView = inManagerMode();
  const [todayReports, monthData, myTasks] = await Promise.all([
    loadDayReports(today), loadMonthReportsAll(currentMonthKey()), loadMyTasks()
  ]);
  const mine = todayReports[state.profile.name] || null;
  const s = monthSummary(state.profile.name, monthData);
  const open = myTasks.filter(t=>t.status!=='done')
    .sort((a,b)=> (a.dueDate||'9999') < (b.dueDate||'9999') ? -1 : 1);
  const overdue = open.filter(t=>isOverdue(t.dueDate, t.status));
  state.counts.tasks = open.length;

  const mgrName = state.profile.managerName;
  const holToday = holidayOn(today);
  const holidayCard = `
    <div class="card section">
      <div class="eyebrow">Today · ${fmtDate(today)}</div>
      <div class="today-title">Today is a public holiday</div>
      <div class="today-line"><span class="badge" style="background:var(--hol-bg);color:var(--hol);">${esc(holToday||'')}</span></div>
      <p class="today-sub">No report needed. Enjoy the day — if you worked anyway, you can still add one.</p>
      <button class="btn btn-ghost" data-goto="employee">I worked today — report anyway</button>
    </div>`;
  const todayCard = (!mine && holToday) ? holidayCard : mine ? `
    <div class="card section">
      <div class="eyebrow">Today · ${fmtDate(today)}</div>
      <div class="today-line">
        <span class="badge ${mine.status}">${statusLabel(mine.status)}</span>
        ${mine.status!=='leave' ? `<span class="mono">${fmtHours(reportHours(mine))}h logged</span>` : `<span class="mono">${esc(mine.leaveType||'')}</span>`}
      </div>
      <p class="today-sub">Submitted${mgrName?' to '+esc(mgrName):''} at ${new Date(mine.submittedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}. You can still edit it today.</p>
      <button class="btn btn-ghost" data-goto="employee">View or edit report</button>
    </div>` : `
    <div class="card section">
      <div class="eyebrow">Today · ${fmtDate(today)}</div>
      <div class="today-title">You haven’t reported yet</div>
      <p class="today-sub">Pick where you’re working today${mgrName?' — it goes to '+esc(mgrName):''}.</p>
      <div class="quick-row">
        <button class="quick-btn office" data-quick="office"><span class="qi">${ico('office',16)}</span>In-Office</button>
        <button class="quick-btn wfh" data-quick="wfh"><span class="qi">${ico('wfh',16)}</span>WFH</button>
        <button class="quick-btn leave" data-quick="leave"><span class="qi">${ico('leave',16)}</span>Leave</button>
      </div>
    </div>`;

  const monthCard = `
    <div class="card section">
      <div class="eyebrow">${monthLabel(currentMonthKey())}</div>
      <div class="tile-grid">
        <div class="tile office"><div class="num">${s.office}</div><div class="lbl">In-Office days</div></div>
        <div class="tile wfh"><div class="num">${s.wfh}</div><div class="lbl">WFH days</div></div>
        <div class="tile leave"><div class="num">${s.leave}</div><div class="lbl">Leave days</div></div>
        <div class="tile"><div class="num">${fmtHours(s.hours)}h</div><div class="lbl">Hours logged</div></div>
      </div>
    </div>`;

  const tasksCard = `
    <div class="card section">
      <div class="eyebrow">My open tasks${open.length?' · '+open.length:''}${overdue.length?' · <span style="color:var(--danger)">'+overdue.length+' overdue</span>':''}</div>
      ${open.length ? open.slice(0,4).map(t=>`
        <div class="mini-task">
          <span class="t">${esc(t.title)}</span>
          <span class="d ${isOverdue(t.dueDate,t.status)?'overdue':''}">${taskDueLabel(t)}</span>
        </div>`).join('') : `<p class="today-sub" style="margin:0;">Nothing waiting on you. Tasks assigned by your manager will show up here.</p>`}
      ${open.length ? `<div class="link-row"><button class="btn-text" data-goto="tasks">See all my tasks →</button></div>` : ''}
    </div>`;

  let teamBlock = '';
  if(teamView){
    const [team, assigned] = await Promise.all([ loadTeamMembers(), loadAssignedTasks() ]);
    const c = {office:0, wfh:0, leave:0};
    team.forEach(n=>{ const r = todayReports[n]; if(r && c[r.status]!==undefined) c[r.status]++; });
    const awaiting = team.filter(n=>!todayReports[n] && isWorkDay(today));
    state.counts.awaiting = awaiting.length;
    const aOpen = assigned.filter(t=>t.status!=='done');
    const aOver = aOpen.filter(t=>isOverdue(t.dueDate,t.status));
    const aDone = assigned.length - aOpen.length;
    const watch = aOpen.slice().sort((a,b)=> (a.dueDate||'9999') < (b.dueDate||'9999') ? -1 : 1).slice(0,3);

    teamBlock = `
    <div class="section-title">Your team today<span class="rule"></span></div>
    <div class="home-row">
      <div class="card section">
        <div class="eyebrow">Attendance · ${team.length} direct report${team.length===1?'':'s'}</div>
        <div class="tile-grid">
          <div class="tile office"><div class="num">${c.office}</div><div class="lbl">In-Office</div></div>
          <div class="tile wfh"><div class="num">${c.wfh}</div><div class="lbl">WFH</div></div>
          <div class="tile leave"><div class="num">${c.leave}</div><div class="lbl">On leave</div></div>
          <div class="tile ${awaiting.length?'warn':''}"><div class="num">${awaiting.length}</div><div class="lbl">Not reported yet</div></div>
        </div>
        ${awaiting.length ? `<div class="await-list">${awaiting.map(n=>`<span class="await-chip"><span class="avatar">${esc(initials(n))}</span>${esc(n)}</span>`).join('')}</div>`
          : (team.length ? `<div class="all-clear">Everyone has reported today.</div>` : `<p class="today-sub" style="margin:14px 0 0;">Nobody reports to you yet. Once people pick you as their manager they’ll appear here.</p>`)}
        <div class="link-row"><button class="btn-text" data-goto="roster">Open today’s roster →</button></div>
      </div>
      <div class="card section">
        <div class="eyebrow">Tasks you assigned</div>
        <div class="tile-grid" style="margin-bottom:6px;">
          <div class="tile"><div class="num">${aOpen.length}</div><div class="lbl">Open</div></div>
          <div class="tile ${aOver.length?'warn':''}"><div class="num">${aOver.length}</div><div class="lbl">Overdue</div></div>
        </div>
        ${watch.length ? watch.map(t=>`
          <div class="mini-task">
            <span class="t">${esc(t.title)}<span style="display:block;font-weight:400;font-size:12px;color:var(--ink-soft);">${esc(t.employeeName)}</span></span>
            <span class="d ${isOverdue(t.dueDate,t.status)?'overdue':''}">${taskDueLabel(t)}</span>
          </div>`).join('') : `<p class="today-sub" style="margin:10px 0 0;">${aDone? aDone+' completed so far. ' : ''}No open tasks right now.</p>`}
        <div class="link-row"><button class="btn-text" data-goto="assign">Assign &amp; track →</button></div>
      </div>
    </div>`;
  }

  return `
  ${teamView ? `<div class="section-title" style="margin-top:0;">My day<span class="rule"></span></div>` : ''}
  <div class="home-row">${todayCard}${monthCard}</div>
  <div class="home-row" style="grid-template-columns:1fr;">${tasksCard}</div>
  ${teamBlock}`;
}

function goPage(key){
  state.role = key;
  state.tsSelected = null;
  state.openRoster = null;
  window.scrollTo({ top:0 });
  render();
}

function setMode(mode){
  if(mode==='manager' && !isManagerUser()) return;
  if(state.mode === mode) return;
  state.mode = mode;
  if(mode==='employee' && TEAM_PAGES.includes(state.role)) state.role = 'home';
  state.tsSelected = null;
  showToast(mode==='manager' ? 'Manager view — team pages are now in the sidebar' : 'Employee view — showing only your own work');
  render();
}

let pickedRole = 'employee';

function bindAuthEvents(){
  const sendLink = document.getElementById('send-link');
  if(sendLink){
    sendLink.onclick = ()=> sendMagicLink(document.getElementById('login-email').value.trim());
  }
  const backToLogin = document.getElementById('back-to-login');
  if(backToLogin){ backToLogin.onclick = ()=>{ auth.screen='login'; paint(); }; }

  pickedRole = 'employee';
  document.querySelectorAll('[data-pick-role]').forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = ()=>{
      pickedRole = btn.dataset.pickRole;

/* ---------- Holidays page ---------- */
const MONTHS3 = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function mkISO(y,m,d){
  if(y<100) y += 2000;
  const dt = new Date(y, m, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m || dt.getDate()!==d) return null;
  return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function parseHolDate(v){
  if(v==null || v==='') return null;
  if(typeof v==='number'){
    if(v<30000 || v>80000) return null; // not an Excel date serial (e.g. a serial number column)
    const dt = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    return mkISO(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate());
  }
  const t = String(v).trim().replace(/(\d)(st|nd|rd|th)\b/i,'$1').replace(/,/g,' ').replace(/\s+/g,' ');
  let m;
  if((m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return mkISO(+m[1], m[2]-1, +m[3]);
  if((m = t.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{2,4})(?:\s.*)?$/))){
    let d=+m[1], mo=+m[2]-1;
    if(mo>11 && d<=12){ const x=d-1; d=mo+1; mo=x; } // looks like mm/dd — swap
    return mkISO(+m[3], mo, d);
  }
  if((m = t.match(/^(\d{1,2})[-\/. ]([A-Za-z]{3,9})[-\/. ](\d{2,4})/))){
    const mo = MONTHS3[m[2].slice(0,3).toLowerCase()];
    return mo===undefined ? null : mkISO(+m[3], mo, +m[1]);
  }
  if((m = t.match(/^([A-Za-z]{3,9})[-\/. ](\d{1,2})[-\/. ](\d{2,4})/))){
    const mo = MONTHS3[m[1].slice(0,3).toLowerCase()];
    return mo===undefined ? null : mkISO(+m[3], mo, +m[2]);
  }
  return null;
}
// rows = array of arrays (from Excel or CSV). Picks the date + name out of each row.
function extractHolidays(rows){
  const found = {}; let skipped = 0;
  const weekday = /^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?$/i;
  rows.forEach(r=>{
    const cells = (r||[]).map(c=>c==null?'':c);
    let di = -1, date = null;
    for(let i=0;i<cells.length;i++){ const d = parseHolDate(cells[i]); if(d){ di=i; date=d; break; } }
    if(di<0){ if(cells.some(c=>String(c).trim())) skipped++; return; }
    let name = '';
    for(let i=0;i<cells.length;i++){
      if(i===di) continue;
      const t = String(cells[i]).trim();
      if(!t || weekday.test(t) || /^\d+$/.test(t) || parseHolDate(cells[i])) continue;
      name = t; break;
    }
    found[date] = name || 'Holiday';
  });
  const list = Object.keys(found).sort().map(date=>({ date, name: found[date] }));
  return { rows: list, skipped };
}
function parseCSVText(text){
  text = text.replace(/^﻿/,'');
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c;
    } else if(c==='"') q = true;
    else if(c===',' || c===';' || c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = ()=>rej(new Error('Could not load the Excel reader'));
    document.head.appendChild(sc);
  });
}
async function readHolidayFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv' || ext==='txt') return parseCSVText(await file.text());
  await loadSheetJS();
  const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
  let rows = [];
  wb.SheetNames.forEach(n=>{ rows = rows.concat(XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:'' })); });
  return rows;
}

function whenLabel(iso){
  const today = todayISO();
  if(iso === today) return 'Today';
  if(iso < today) return '';
  const days = Math.round((new Date(iso+'T00:00:00') - new Date(today+'T00:00:00'))/86400000);
  return days===1 ? 'Tomorrow' : 'In ' + days + ' days';
}

    return `<div class="card section"><div class="task-empty"><div style="font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink);margin-bottom:6px;">No direct reports yet</div><div>Once someone selects you as their manager, you can assign tasks to them here.</div></div></div>`;
  }

  const d = state.taskDraft;
  const all = state.assignedTasks;
  const openN = all.filter(t=>t.status!=='done').length;
  const overN = all.filter(t=>isOverdue(t.dueDate,t.status)).length;
  const doneN = all.length - openN;
  const filtered = state.taskFilter==='all' ? all : all.filter(t=>t.status===state.taskFilter);
  const cnt = f => f==='all' ? all.length : all.filter(t=>t.status===f).length;
  const allSelected = state.assignableEmployees.length > 0 && state.assignableEmployees.every(e=>d.employeeIds.includes(e.id));

  return `
  <div class="card section form-card">
    <h2 class="form-title">New task</h2>
    <p class="form-sub">Four quick steps. The task lands in each person’s My Tasks right away.</p>

    <div class="step">
      <label class="step-label" for="task-title"><span class="step-n">1</span>Task title <span class="req">*</span></label>
      <input type="text" id="task-title" class="control lg" value="${esc(d.title)}" placeholder="e.g. Finish Q3 report draft" autocomplete="off">
    </div>

    <div class="step">
      <label class="step-label" for="task-desc"><span class="step-n">2</span>Description <span class="opt">optional</span></label>
      <textarea id="task-desc" class="control" placeholder="Add context, links or what “done” looks like…">${esc(d.description)}</textarea>
    </div>

    <div class="step">
      <div class="step-label"><span class="step-n">3</span>Assign to <span class="req">*</span>
        <button type="button" class="btn-text step-aside" id="assign-all">${allSelected ? 'Clear all' : 'Select all'}</button>
      </div>
      <div class="assignee-grid">
        ${state.assignableEmployees.map(e=>`
          <label class="assignee-check ${d.employeeIds.includes(e.id)?'checked':''}">
            <input type="checkbox" class="assignee-box" value="${e.id}" ${d.employeeIds.includes(e.id)?'checked':''}>
            ${esc(e.full_name)}
          </label>`).join('')}
      </div>
    </div>

    <div class="step">
      <label class="step-label" for="task-due"><span class="step-n">4</span>Due date <span class="opt">optional</span></label>
      <input type="date" id="task-due" class="control date-control" value="${d.dueDate}" min="${todayISO()}">
    </div>

    <div class="form-actions">
      <div class="assign-summary" id="assign-summary"></div>
      <button class="btn btn-primary btn-lg" id="assign-task-btn">Assign task</button>
    </div>
  </div>

  <div class="card section" id="tracker">
    <div class="tracker-head"><h2>Tasks you’ve assigned</h2></div>
    <div class="tracker-sum">
      <span><b>${openN}</b> open</span>
      <span class="${overN?'warn':''}"><b>${overN}</b> overdue</span>
      <span><b>${doneN}</b> done</span>
    </div>
    <div class="filter-row" style="margin-bottom:14px;">
      ${['all','todo','in_progress','done'].map(f=>`
        <button class="chip ${state.taskFilter===f?'active':''}" data-taskfilter="${f}">${f==='all'?'All':taskStatusLabel(f)}<span class="cnt">${cnt(f)}</span></button>
      `).join('')}
    </div>
    ${filtered.length ? filtered.map(t=>taskCard(t, { showAssignedBy:false, editableStatus:false, canDelete:true })).join('') : `<div class="hint">No tasks in this filter.</div>`}
  </div>`;
}

        <div class="ts-month-label">${monthLabel(state.mgrMonth)}</div>
        <button id="mgr-ts-next" ${state.mgrMonth>=currentMonthKey()?'disabled style="opacity:.3;cursor:default;"':''}>›</button>
      </div>
      <div class="legend">
        <span><span class="dot office"></span>In-Office</span>
        <span><span class="dot wfh"></span>WFH</span>
        <span><span class="dot leave"></span>Leave</span>
        <span><span class="dot holiday"></span>Holiday</span>
        <span><span class="dot none"></span>No report</span>

      <div class="stat wfh"><div class="num">${s.wfh}</div><div class="lbl">WFH days</div></div>
      <div class="stat leave"><div class="num">${s.leave}</div><div class="lbl">Leave days</div></div>
      <div class="stat"><div class="num">${fmtHours(s.hours)}h</div><div class="lbl">Hours logged</div></div>
