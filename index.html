    <div class="hint">Tap a day to see ${esc(state.mgrEmployee||'their')}'s log.</div>

    <div style="display:flex;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-ghost" id="export-emp-csv">Download ${esc(state.mgrEmployee||'employee')}'s month (CSV)</button>
    </div>
  </div>
  ${state.tsSelected ? dayDrawerHTML(state.tsSelected, selectedReport, { own:false, who: state.mgrEmployee }) : ''}`;
}

async function managerRosterView(){
  const rawReports = await loadDayReports(state.date);
  const reports = {};
  Object.keys(rawReports).forEach(n=>{ if(n !== state.profile.name) reports[n] = rawReports[n]; });
  state.dayReports = reports;
  const names = Object.keys(reports);
  const counts = {office:0,wfh:0,leave:0};
  names.forEach(n=>{ if(reports[n] && counts[reports[n].status] !== undefined) counts[reports[n].status]++; });

  const filtered = names.filter(n=>{
    if(state.managerFilter==='all') return true;
    return reports[n].status === state.managerFilter;
  }).sort((a,b)=>a.localeCompare(b));

  const team = await loadTeamMembers();
  const awaiting = team.filter(n=>!reports[n] && isWorkDay(state.date));
  if(state.date === todayISO()) state.counts.awaiting = awaiting.length;

  return `
  ${holidayBanner(state.date, true)}
  ${dateBar()}
  <div class="stat-bar">
    <div class="stat office"><div class="num">${counts.office}</div><div class="lbl">In-Office</div></div>
    <div class="stat wfh"><div class="num">${counts.wfh}</div><div class="lbl">WFH</div></div>
    <div class="stat leave"><div class="num">${counts.leave}</div><div class="lbl">On Leave</div></div>
    <div class="stat"><div class="num">${names.length}</div><div class="lbl">Reports in</div></div>
  </div>
  ${awaiting.length ? `
  <div class="card section" style="padding:14px 20px;">
    <div class="eyebrow" style="margin-bottom:0;">Not reported yet \u00b7 ${awaiting.length}</div>
    <div class="await-list">${awaiting.map(n=>`<span class="await-chip"><span class="avatar">${esc(initials(n))}</span>${esc(n)}</span>`).join('')}</div>
  </div>` : ''}

  <div class="filter-row">
    ${['all','office','wfh','leave'].map(f=>`
      <button class="chip ${state.managerFilter===f?'active':''}" data-filter="${f}">
        ${f==='all'?'All':statusLabel(f)}
      </button>
    `).join('')}
  </div>

  <div class="card section">
    <h2>Team roster — ${fmtDate(state.date)}</h2>
    ${filtered.length ? filtered.map(n=>rosterItem(n, reports[n])).join('') : `
      <div class="empty-state">
        <div class="big">No reports yet for this date</div>
        <div>Once the team submits, their status will show up here.</div>
      </div>`}
  </div>`;
}

function rosterItem(name, report){
  const open = state.openRoster===name ? 'open' : '';
  const isLeave = report.status==='leave';
  return `
  <div class="roster-item">
    <div class="roster-head" data-name="${esc(name)}">
      <div class="roster-left">
        <div class="avatar">${initials(name)}</div>
        <div>
          <div class="r-name">${esc(name)}</div>
          <div class="r-meta">${isLeave ? esc(report.leaveType) : (report.entries||[]).length + ' entries · ' + fmtHours(reportHours(report)) + 'h'} · ${new Date(report.submittedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      </div>
      <span class="badge ${report.status}">${statusLabel(report.status)}</span>
    </div>
    <div class="roster-body ${open}">
      ${isLeave ? `<p style="font-size:13.5px;line-height:1.6;">${esc(report.leaveReason)}</p>` : `
        <div class="timeline">
          ${(report.entries||[]).map(e=>`
            <div class="tl-item">
              <div class="tl-time">${esc(e.start)}–${esc(e.end)}</div>
              <div class="tl-desc">${esc(e.description)}</div>
            </div>`).join('') || '<div class="hint">No entries logged.</div>'}
        </div>`}
    </div>
  </div>`;
}

/* ---------- Events ---------- */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=> goPage(b.dataset.nav);
  });
  document.querySelectorAll('[data-goto]').forEach(b=>{
    b.onclick = ()=> goPage(b.dataset.goto);
  });
  document.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = ()=> setMode(b.dataset.mode);
  });
  document.querySelectorAll('[data-quick]').forEach(b=>{
    b.onclick = ()=>{
      const st = b.dataset.quick;
      state.date = todayISO();
      state.editing = false;
      state.draft = { status: st, entries: [], leaveType:'Full day', leaveReason:'' };
      if(st !== 'leave') state.draft.entries.push({id:uid(), start:'', end:'', description:''});
      goPage('employee');
    };
  });
  const burger = document.getElementById('burger');
  const shellEl = document.getElementById('shell');
  if(burger && shellEl){ burger.onclick = ()=> shellEl.classList.add('nav-open'); }
  const scrim = document.getElementById('scrim');
  if(scrim && shellEl){ scrim.onclick = ()=> shellEl.classList.remove('nav-open'); }

  const signOutBtn = document.getElementById('sign-out');
  if(signOutBtn){ signOutBtn.onclick = signOut; }

  const mgrInline = document.getElementById('pf-manager-inline');
  if(mgrInline){
    mgrInline.onchange = async ()=>{ await updateManagerSelection(mgrInline.value); render(); };
  }

  const datePicker = document.getElementById('date-picker');
  if(datePicker){
    datePicker.onchange = ()=>{
      state.date = datePicker.value;
      state.editing = false;
      state.draft = { status:'office', entries:[], leaveType:'Full day', leaveReason:'' };
      render();
    };
  }

  document.querySelectorAll('.status-card').forEach(c=>{
    c.onclick = ()=>{
      state.draft.status = c.dataset.status;
      if(state.draft.status!=='leave' && state.draft.entries.length===0){
        state.draft.entries.push({id:uid(), start:'', end:'', description:''});
      }
      render();
    };
  });

  const addEntry = document.getElementById('add-entry');
  if(addEntry){
    addEntry.onclick = ()=>{
      syncEntriesFromDOM();
      state.draft.entries.push({id:uid(), start:'', end:'', description:''});
      render();
    };
  }

  document.querySelectorAll('.remove-entry').forEach(btn=>{
    btn.onclick = ()=>{
      syncEntriesFromDOM();
      const row = btn.closest('.ledger-row');
      const id = row.dataset.id;
      state.draft.entries = state.draft.entries.filter(e=>e.id!==id);
      render();
    };
  });

  // Live hours: recalculate per-row and the running total as the person
  // types, without a full re-render (which would drop input focus).
  document.querySelectorAll('.ledger-row').forEach(row=>{
    const startEl = row.querySelector('.e-start');
    const endEl = row.querySelector('.e-end');
    if(!startEl || !endEl) return;
    const recalc = ()=>{
      const hrs = entryHours({start:startEl.value, end:endEl.value});
      const hrsEl = row.querySelector('.e-hours');
      hrsEl.textContent = hrs>0 ? fmtHours(hrs)+'h' : '—';
      hrsEl.classList.toggle('has-val', hrs>0);
      updateTodayTotal();
    };
    startEl.oninput = recalc;
    endEl.oninput = recalc;
  });

  const leaveType = document.getElementById('leave-type');
  if(leaveType) leaveType.onchange = ()=>{ state.draft.leaveType = leaveType.value; };
  const leaveReason = document.getElementById('leave-reason');
  if(leaveReason) leaveReason.oninput = ()=>{ state.draft.leaveReason = leaveReason.value; };

  const submitBtn = document.getElementById('submit-report');
  if(submitBtn) submitBtn.onclick = submitReport;

  const editBtn = document.getElementById('edit-report');
  if(editBtn){
    editBtn.onclick = ()=>{
      const r = state.todaysReport;
      state.draft = {
        status: r.status,
        entries: (r.entries || [{id:uid(),start:'',end:'',description:''}]).map(e=>({...e, id:e.id||uid()})),
        leaveType: r.leaveType || 'Full day',
        leaveReason: r.leaveReason || ''
      };
      state.editing = true;
      render();
    };
  }

  const cancelEdit = document.getElementById('cancel-edit');
  if(cancelEdit){
    cancelEdit.onclick = ()=>{ state.editing = false; render(); };
  }

  document.querySelectorAll('.chip[data-filter]').forEach(c=>{
    c.onclick = ()=>{ state.managerFilter = c.dataset.filter; render(); };
  });

  document.querySelectorAll('.roster-head').forEach(h=>{
    h.onclick = ()=>{
      const name = h.dataset.name;
      state.openRoster = state.openRoster===name ? null : name;
      render();
    };
  });

  /* --- My Timesheet --- */
  const tsPrev = document.getElementById('ts-prev');
  if(tsPrev) tsPrev.onclick = ()=>{ state.tsMonth = shiftMonth(state.tsMonth,-1); state.tsSelected=null; render(); };
  const tsNext = document.getElementById('ts-next');
  if(tsNext) tsNext.onclick = ()=>{ if(state.tsMonth<currentMonthKey()){ state.tsMonth = shiftMonth(state.tsMonth,1); state.tsSelected=null; render(); } };

  const exportMy = document.getElementById('export-my-csv');
  if(exportMy) exportMy.onclick = async ()=>{
    const monthData = await loadMonthReportsAll(state.tsMonth);
    exportEmployeeMonthCSV(state.profile.name, state.tsMonth, monthData);
    showToast('Timesheet downloaded');
  };

  const tsEditDay = document.getElementById('ts-edit-day');
  if(tsEditDay) tsEditDay.onclick = ()=>{
    const iso = state.tsSelected;
    const r = state._drawerReport;
    state.role = 'employee';
    state.date = iso;
    state.tsSelected = null;
    if(r){
      state.draft = {
        status: r.status,
        entries: (r.entries && r.entries.length ? r.entries : [{start:'',end:'',description:''}]).map(e=>({...e, id:e.id||uid()})),
        leaveType: r.leaveType || 'Full day',
        leaveReason: r.leaveReason || ''
      };
      state.editing = true;
    } else {
      state.draft = { status:'office', entries:[{id:uid(),start:'',end:'',description:''}], leaveType:'Full day', leaveReason:'' };
      state.editing = false;
    }
    window.scrollTo({ top:0 });
    render();
  };

  /* --- Manager: employee selector + month nav + exports --- */
  const mgrEmp = document.getElementById('mgr-employee');
  if(mgrEmp) mgrEmp.onchange = ()=>{ state.mgrEmployee = mgrEmp.value; state.tsSelected = null; render(); };

  const mgrPrev = document.getElementById('mgr-ts-prev');
  if(mgrPrev) mgrPrev.onclick = ()=>{ state.mgrMonth = shiftMonth(state.mgrMonth,-1); state.tsSelected=null; render(); };
  const mgrNext = document.getElementById('mgr-ts-next');
  if(mgrNext) mgrNext.onclick = ()=>{ if(state.mgrMonth<currentMonthKey()){ state.mgrMonth = shiftMonth(state.mgrMonth,1); state.tsSelected=null; render(); } };

  const exportEmp = document.getElementById('export-emp-csv');
  if(exportEmp) exportEmp.onclick = async ()=>{
    if(!state.mgrEmployee) return;
    const monthData = await loadMonthReportsAll(state.mgrMonth);
    exportEmployeeMonthCSV(state.mgrEmployee, state.mgrMonth, monthData);
    showToast('Timesheet downloaded');
  };

  const exportTeam = document.getElementById('export-team-csv');
  if(exportTeam) exportTeam.onclick = async ()=>{
    const monthData = await loadMonthReportsAll(state.mgrMonth);
    exportTeamMonthCSV(state.mgrMonth, monthData, state.teamMembers);
    showToast('Team timesheet downloaded');
  };

  /* --- Calendar day click (shared by employee + manager timesheet) --- */
  document.querySelectorAll('.ts-day[data-iso]').forEach(cell=>{
    cell.onclick = ()=>{
      const iso = cell.dataset.iso;
      if(!iso) return;
      state._drawerEnter = !state.tsSelected;
      state.tsSelected = iso;
      render();
    };
    cell.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); cell.onclick(); } };
  });

  ['drawer-scrim','drawer-close','drawer-close-2'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onclick = closeDrawer;
  });

  /* --- Holidays --- */
  const fillNext = document.getElementById('fill-next');
  if(fillNext) fillNext.onclick = ()=>{
    state.role = 'employee'; state.date = fillNext.dataset.iso; state.tsSelected = null;
    state.draft = { status:'office', entries:[{id:uid(),start:'',end:'',description:''}], leaveType:'Full day', leaveReason:'' };
    state.editing = false; window.scrollTo({ top:0 }); render();
  };
  const holFile = document.getElementById('hol-file');
  if(holFile) holFile.onchange = async ()=>{
    const f = holFile.files[0]; if(!f) return;
    try{
      const r = extractHolidays(await readHolidayFile(f));
      state.hol = { rows:r.rows, skipped:r.skipped, file:f.name,
        error: r.rows.length ? '' : 'No dates found in this file. Make sure it has a column with dates (like 26-Jan-2026) and one with the holiday name.' };
    }catch(e){
      console.error(e);
      state.hol = { rows:[], skipped:0, file:f.name, error:'Could not read this file. Try saving it as .xlsx or .csv and upload again.' };
    }
    render();
  };
  const holCancel = document.getElementById('hol-cancel');
  if(holCancel) holCancel.onclick = ()=>{ state.hol = { rows:[], skipped:0, file:'', error:'' }; render(); };
  const holImport = document.getElementById('hol-import');
  if(holImport) holImport.onclick = async ()=>{
    const rows = state.hol.rows;
    holImport.disabled = true;
    if(await saveHolidays(rows)){
      await refreshHolidays();
      state.hol = { rows:[], skipped:0, file:'', error:'' };
      showToast(rows.length + ' holiday' + (rows.length===1?'':'s') + ' saved');
    }
    render();
  };
  const holAdd = document.getElementById('hol-add');
  if(holAdd) holAdd.onclick = async ()=>{
    const d = document.getElementById('hol-add-date').value;
    const n = document.getElementById('hol-add-name').value.trim();
    if(!d){ showToast('Pick a date first'); return; }
    if(!n){ showToast('Add a holiday name'); return; }
    if(await saveHolidays([{ date:d, name:n }])){ await refreshHolidays(); showToast('Holiday added'); render(); }
  };
  document.querySelectorAll('.hol-del').forEach(b=>{
    b.onclick = async ()=>{ await deleteHoliday(b.dataset.iso); await refreshHolidays(); showToast('Holiday removed'); render(); };
  });
  const holSample = document.getElementById('hol-sample');
  if(holSample) holSample.onclick = ()=>{
    const y = new Date().getFullYear();
    downloadCSV('holidays_sample.csv', [['Date','Day','Holiday'],[y+'-01-01','','New Year’s Day'],['26-01-'+y,'','Republic Day'],['15-Aug-'+y,'','Independence Day'],['02/10/'+y,'','Gandhi Jayanti'],[y+'-12-25','','Christmas']]);
  };

  /* --- Tasks --- */
  document.querySelectorAll('.chip[data-taskfilter]').forEach(c=>{
    c.onclick = ()=>{ state.taskFilter = c.dataset.taskfilter; render(); };
  });

  const updateAssignSummary = ()=>{
    const el = document.getElementById('assign-summary');
    if(!el) return;
    const n = state.taskDraft.employeeIds.length;
    el.innerHTML = n ? 'Will be assigned to <strong>' + n + (n===1?' person':' people') + '</strong>' : 'Choose at least one person in step 3';
    const allBtn = document.getElementById('assign-all');
    if(allBtn) allBtn.textContent = (n && n === state.assignableEmployees.length) ? 'Clear all' : 'Select all';
  };
  updateAssignSummary();

  document.querySelectorAll('.assignee-box').forEach(box=>{
    box.onchange = ()=>{
      const id = box.value;
      const idx = state.taskDraft.employeeIds.indexOf(id);
      if(box.checked && idx===-1) state.taskDraft.employeeIds.push(id);
      if(!box.checked && idx!==-1) state.taskDraft.employeeIds.splice(idx,1);
      box.closest('.assignee-check').classList.toggle('checked', box.checked);
      updateAssignSummary();
    };
  });

  const assignAll = document.getElementById('assign-all');
  if(assignAll) assignAll.onclick = ()=>{
    const everyone = state.assignableEmployees.map(e=>e.id);
    const allOn = everyone.every(id=>state.taskDraft.employeeIds.includes(id));
    state.taskDraft.employeeIds = allOn ? [] : everyone.slice();
    document.querySelectorAll('.assignee-box').forEach(box=>{
      box.checked = !allOn;
      box.closest('.assignee-check').classList.toggle('checked', !allOn);
    });
    updateAssignSummary();
  };

  // keep what's typed so a re-render never wipes the form
  const tTitle = document.getElementById('task-title');
  if(tTitle) tTitle.oninput = ()=>{ state.taskDraft.title = tTitle.value; };
  const tDesc = document.getElementById('task-desc');
  if(tDesc) tDesc.oninput = ()=>{ state.taskDraft.description = tDesc.value; };
  const tDue = document.getElementById('task-due');
  if(tDue) tDue.onchange = ()=>{ state.taskDraft.dueDate = tDue.value; };

  const assignBtn = document.getElementById('assign-task-btn');
  if(assignBtn){
    assignBtn.onclick = async ()=>{
      const title = document.getElementById('task-title').value.trim();
      const description = document.getElementById('task-desc').value;
      const dueDate = document.getElementById('task-due').value;
      const employeeIds = state.taskDraft.employeeIds;
      if(!title){ showToast('Step 1: give the task a title'); document.getElementById('task-title').focus(); return; }
      if(employeeIds.length===0){ showToast('Step 3: choose who it’s for'); return; }
      const n = employeeIds.length;
      const ok = await createTasks(employeeIds, title, description, dueDate);
      if(ok){
        state.taskDraft = { employeeIds: [], title: '', description: '', dueDate: '' };
        state.taskFilter = 'all';
        showToast('Task assigned to ' + n + (n===1?' person':' people'));
        await render();
        const tr = document.getElementById('tracker');
        if(tr) tr.scrollIntoView({ behavior:'smooth', block:'start' });
      }
    };
  }

  document.querySelectorAll('[data-task-status]').forEach(sel=>{
    sel.onchange = async ()=>{
      await updateTaskStatus(sel.dataset.taskStatus, sel.value);
      render();
    };
  });

  document.querySelectorAll('.task-delete').forEach(btn=>{
    btn.onclick = async ()=>{
      await deleteTask(btn.dataset.taskId);
      render();
    };
  });
}

function updateTodayTotal(){
  const totalEl = document.getElementById('today-total-hrs');
  if(!totalEl) return;
  let sum = 0;
  document.querySelectorAll('.ledger-row').forEach(row=>{
    const s = row.querySelector('.e-start').value;
    const en = row.querySelector('.e-end').value;
    sum += entryHours({start:s, end:en});
  });
  totalEl.textContent = fmtHours(sum)+'h';
}

function syncEntriesFromDOM(){
  document.querySelectorAll('.ledger-row').forEach(row=>{
    const id = row.dataset.id;
    const e = state.draft.entries.find(x=>x.id===id);
    if(!e) return;
    e.start = row.querySelector('.e-start').value;
    e.end = row.querySelector('.e-end').value;
    e.description = row.querySelector('.e-desc').value;
  });
}

async function submitReport(){
  syncEntriesFromDOM();
  const d = state.draft;

  if(!state.profile.managerId){
    showToast('Please select who you report to before submitting');
    return;
  }

  if(d.status === 'leave'){
    if(!d.leaveReason || !d.leaveReason.trim()){
      showToast('Please enter a reason for your leave');
      return;
    }
  } else {
    const touched = d.entries.filter(e => e.start || e.end || (e.description && e.description.trim()));
    if(touched.length===0){
      showToast('Add at least one work entry');
      return;
    }
    const incomplete = touched.filter(e => !e.start || !e.end || !(e.description && e.description.trim()));
    if(incomplete.length){
      showToast('Every entry needs a start time, end time and description');
      return;
    }
    const badRange = touched.filter(e => timeToHours(e.end) <= timeToHours(e.start));
    if(badRange.length){
      showToast('End time must be after start time');
      return;
    }
  }

  const report = {
    status: d.status,
    entries: d.status!=='leave' ? d.entries.filter(e=>e.description && e.description.trim()) : [],
    leaveType: d.status==='leave' ? d.leaveType : null,
    leaveReason: d.status==='leave' ? d.leaveReason.trim() : null,
    managerName: state.profile.managerName || '',
    submittedAt: new Date().toISOString()
  };

  const reports = await loadDayReports(state.date);
  reports[state.profile.name] = report;
  await saveDayReports(state.date, reports);
  await registerMember(state.profile.name);

  state.editing = false;
  showToast('Report submitted to ' + (state.profile.managerName || 'your manager'));
  render();
}

/* ---------- Init ---------- */
(function init(){
  if(state.draft.entries.length===0 && state.draft.status!=='leave'){
    state.draft.entries.push({id:uid(), start:'', end:'', description:''});
  }
  initAuth();
})();
</script>
